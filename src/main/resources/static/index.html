<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식단 자동화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    /* 위쪽 띠: 랜딩 페이지와 같은 어두운 바탕 */
    --band: #0f1311; --band-ink: #ecefe9; --band-muted: #a3aca6; --band-line: rgba(236, 239, 233, 0.14);
    /* 아래쪽 작업 영역 */
    --paper: #eef1ec; --panel: #ffffff; --text: #18201b; --muted: #5b655f; --line: #d5dbd4;
    --accent: #2f6f4f; --accent-soft: #e1ece5; --danger: #a63d33;
    /* 세 가닥 색 (랜딩과 같은 값). -ink는 어두운 띠 위에서 읽히도록 밝힌 값 */
    --carb: #d9a441; --protein: #2f6f4f; --fat: #b06a3b;
    --carb-ink: #e2b25a; --protein-ink: #7fbf9c; --fat-ink: #d98e5f;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --wrap: 1040px;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.55; word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ───────── 공통 입력 요소 ───────── */
  input, select, button { font: inherit; color: inherit; min-width: 0; }
  input, select {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600;
    transition: transform 120ms var(--ease-out), background-color 150ms;
  }
  button:hover:not(:disabled) { background: #275e43; }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: default; }
  .quiet { background: none; color: var(--muted); font-weight: 500; padding: 6px 10px; }
  .quiet:hover:not(:disabled) { background: rgba(0, 0, 0, 0.05); color: var(--text); }

  /* ───────── 위쪽 띠: 오늘의 세 가닥 ───────── */
  .band { background: var(--band); color: var(--band-ink); padding: 18px 0 40px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { color: var(--band-ink); text-decoration: none; font-weight: 700; letter-spacing: -0.02em; }
  .brand:focus-visible { outline: 2px solid var(--carb-ink); outline-offset: 4px; border-radius: 4px; }
  .account { display: flex; align-items: center; gap: 4px; color: var(--band-muted); font-size: 14px; }
  .band .quiet { color: var(--band-muted); }
  .band .quiet:hover:not(:disabled) { background: var(--band-line); color: var(--band-ink); }
  .band input, .band button { outline-color: var(--carb-ink); }

  .day-nav { display: flex; align-items: center; gap: 2px; margin-top: 36px; }
  .day-nav input {
    background: transparent; color: var(--band-ink); border: 1px solid var(--band-line);
    color-scheme: dark; padding: 6px 10px; font-size: 14px;
  }
  .day-nav .quiet { font-size: 18px; line-height: 1; padding: 6px 10px; }

  .day-label { margin: 18px 0 0; color: var(--band-muted); font-size: 15px; }
  .kcal-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
  .kcal {
    position: relative; font-size: clamp(64px, 11vw, 112px); font-weight: 800; line-height: 1;
    letter-spacing: -0.045em; font-variant-numeric: tabular-nums;
  }
  .kcal-unit { font-size: 0.32em; font-weight: 600; letter-spacing: -0.01em; margin-left: 6px; }
  .kcal-meta { color: var(--band-muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  /* 기록을 바꾸면: 숫자는 굴러가고, 증감 칩이 떠올랐다 사라짐 */
  .delta {
    position: absolute; left: 100%; top: 0.1em; margin-left: 12px; white-space: nowrap;
    padding: 3px 10px; border-radius: 999px; font-size: 15px; font-weight: 700; letter-spacing: 0;
    color: var(--band); background: var(--protein-ink); opacity: 0; pointer-events: none;
  }
  .delta.minus { background: var(--band-muted); }
  .delta.show { animation: delta-pop 2400ms var(--ease-out) forwards; }
  @keyframes delta-pop {
    0% { opacity: 0; transform: translateY(8px); }
    12%, 75% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }

  /* 세 가닥: 목표까지 얼마나 채웠는지 굵은 선으로 */
  .strands { list-style: none; margin: 30px 0 0; padding: 0; display: grid; gap: 14px; }
  .strand { display: grid; grid-template-columns: 5em 1fr auto; align-items: center; gap: 16px; }
  .strand-name { font-size: 15px; font-weight: 600; }
  .strand-track { height: 14px; border-radius: 999px; background: var(--band-line); overflow: hidden; }
  .strand-fill {
    height: 100%; border-radius: 999px; background: var(--c);
    clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0 round 999px);
    transition: clip-path 800ms var(--ease-out);
  }
  .strand-value { font-size: 14px; color: var(--band-muted); font-variant-numeric: tabular-nums; min-width: 8.5em; text-align: right; }
  .strand-value b { color: var(--band-ink); font-weight: 600; }
  .strand[data-n="carb"] { --c: var(--carb-ink); }
  .strand[data-n="protein"] { --c: var(--protein-ink); }
  .strand[data-n="fat"] { --c: var(--fat-ink); }
  .strand[data-n="carb"] .strand-name { color: var(--carb-ink); }
  .strand[data-n="protein"] .strand-name { color: var(--protein-ink); }
  .strand[data-n="fat"] .strand-name { color: var(--fat-ink); }

  /* ───────── 먹은 거 적기 (띠에 걸쳐 올라온 패널) ───────── */
  .log-panel {
    position: relative; margin-top: -22px; background: var(--panel); border-radius: 18px;
    padding: 22px 22px 18px; box-shadow: 0 1px 0 var(--line), 0 12px 32px -18px rgba(15, 19, 17, 0.45);
  }
  .log-panel h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: -0.01em; }
  .ai-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .ai-form input { font-size: 17px; padding: 14px 16px; border-radius: 12px; background: var(--paper); border-color: transparent; }
  .ai-form input:focus-visible { background: #fff; border-color: var(--line); }
  .ai-form button { padding: 0 22px; border-radius: 12px; }
  .meal-pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; border: 0; }
  .meal-pick label { position: relative; }
  .meal-pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .meal-pick span {
    display: block; padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--muted);
    border: 1px solid var(--line); transition: background-color 150ms, color 150ms;
  }
  .meal-pick input:checked + span { background: var(--text); border-color: var(--text); color: #fff; font-weight: 600; }
  .meal-pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ai-note { margin: 12px 0 0; color: var(--muted); font-size: 13px; }

  .manual { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
  .manual > summary { cursor: pointer; padding: 8px 0; color: var(--muted); font-size: 14px; width: fit-content; }
  .manual > summary:hover { color: var(--text); }
  .meal-form { display: grid; grid-template-columns: 2fr 1fr 110px auto; gap: 8px; padding: 4px 0 6px; }
  #food.highlight { outline: 2px solid var(--accent); outline-offset: 1px; }

  .info, .error { font-size: 14px; margin-top: 8px; min-height: 20px; }
  .info { color: var(--accent); }
  .info:empty, .error:empty { min-height: 0; margin: 0; }
  .error { color: var(--danger); }

  /* ───────── 기록 + 추천 ───────── */
  .day-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; margin-top: 44px; align-items: start; }
  .section-title { margin: 0 0 14px; font-size: 18px; letter-spacing: -0.01em; }

  .meal-group { padding: 14px 0; border-top: 1px solid var(--line); }
  .meal-group:last-child { border-bottom: 1px solid var(--line); }
  .meal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .meal-head h3 { margin: 0; font-size: 15px; }
  .meal-head span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .entries { list-style: none; margin: 0; padding: 0; }
  .entry { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 14px; padding: 4px 0; }
  .entry-name { min-width: 0; }
  .entry-num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; text-align: right; }
  .entry-num.kcal-col { color: var(--text); min-width: 4.5em; }
  .del { background: none; color: var(--muted); font-weight: 500; font-size: 13px; padding: 4px 8px; }
  .del:hover:not(:disabled) { background: #f6e6e3; color: var(--danger); }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
    font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  }
  .empty { color: var(--muted); padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

  /* 추천: 채워 줄 영양소의 가닥 색을 따라감 */
  .recommend { --c: var(--accent); background: var(--panel); border-radius: 16px; padding: 22px 20px 20px; }
  .recommend::before {
    content: ""; display: block; width: 56px; height: 6px; border-radius: 999px; background: var(--c); margin-bottom: 16px;
  }
  .recommend[data-n="carb"] { --c: var(--carb); }
  .recommend[data-n="protein"] { --c: var(--protein); }
  .recommend[data-n="fat"] { --c: var(--fat); }
  .recommend .section-title { color: var(--muted); font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .rec-head { margin: 0; font-size: 17px; }
  .rec-head strong { display: block; font-size: 26px; letter-spacing: -0.03em; line-height: 1.25; }
  .rec-kcal { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rec-steps { list-style: none; margin: 18px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); display: grid; gap: 14px; }
  .rec-steps > li { display: grid; gap: 6px; }
  .rec-step { font-size: 13px; font-weight: 600; color: var(--muted); }
  .rec-calc { font-variant-numeric: tabular-nums; font-size: 15px; }
  .rec-calc .note { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
  .shortfalls { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .shortfalls li {
    display: grid; grid-template-columns: 4.5em 1fr auto; gap: 10px; align-items: baseline;
    margin: 0 -6px; padding: 2px 6px; border-radius: 6px;
    font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .shortfalls li.pick { color: var(--text); font-weight: 600; }
  .rec-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

  /* 추천이 바뀌면: 근거 단계가 위에서 아래로 펼쳐지고, 새로 고른 영양소가 잠깐 물듦 */
  .recalc .rec-head { animation: rec-in 450ms var(--ease-out) both; }
  .recalc .rec-steps { animation: rec-unroll 650ms var(--ease-out) 80ms both; }
  .recalc .shortfalls li.pick { animation: pick-wash 1600ms ease-out 350ms both; }
  @keyframes rec-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes rec-unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes pick-wash { from { background: color-mix(in srgb, var(--c) 28%, transparent); } to { background: transparent; } }

  /* ───────── 관리 (접어 두는 영역) ───────── */
  .manage { margin: 56px 0 72px; }
  .manage .section-title { color: var(--muted); font-size: 15px; font-weight: 600; }
  .fold { border-top: 1px solid var(--line); }
  .fold:last-child { border-bottom: 1px solid var(--line); }
  .fold > summary {
    cursor: pointer; list-style: none; padding: 16px 0; font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 20px; line-height: 1; }
  .fold[open] > summary::after { content: "−"; }
  .fold > summary small { color: var(--muted); font-weight: 400; font-size: 14px; margin-right: auto; margin-left: 10px; }
  .fold-body { padding: 0 0 22px; }
  .target-form { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 10px; align-items: end; }
  .food-form { display: grid; grid-template-columns: 2fr repeat(4, 1fr) auto; gap: 8px; }
  .public-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.empty-cell { color: var(--muted); text-align: center; padding: 18px; }
  .sub { display: block; color: var(--muted); font-size: 12px; }
  .import { padding: 5px 12px; font-size: 13px; }

  @media (max-width: 760px) {
    .day-grid { grid-template-columns: 1fr; gap: 36px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .day-nav { margin-top: 24px; }
    .strand { grid-template-columns: 4.2em 1fr; gap: 6px 12px; }
    .strand-value { grid-column: 2; text-align: left; min-width: 0; margin-top: -4px; }
    .delta { position: static; display: inline-block; vertical-align: 0.9em; margin-left: 8px; }
    .log-panel { padding: 18px 16px 14px; border-radius: 16px; }
    .ai-form { grid-template-columns: 1fr; }
    .ai-form button { padding: 12px; }
    .meal-form, .food-form, .target-form { grid-template-columns: 1fr 1fr; }
    .meal-form #food, .food-form #foodName { grid-column: 1 / -1; }
    .entry { grid-template-columns: 1fr auto auto; gap: 10px; }
    .entry-num.grams-col { display: none; }
    .fold > summary small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .strand-fill { transition: none; }
    .delta.show { animation-name: delta-fade; }
    @keyframes delta-fade { 0% { opacity: 0; } 10%, 75% { opacity: 1; } 100% { opacity: 0; } }
    .recalc .rec-head { animation-name: rec-fade; }
    .recalc .rec-steps { animation: none; }
    @keyframes rec-fade { from { opacity: 0; } to { opacity: 1; } }
    button { transition: none; }
    button:active:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="/landing.html">식단 자동화</a>
      <div class="account">
        <span><span id="username"></span>님</span>
        <button class="quiet" id="logout">로그아웃</button>
      </div>
    </div>

    <div class="day-nav">
      <button class="quiet" id="prevDay" aria-label="전날 보기">‹</button>
      <input type="date" id="date" aria-label="날짜">
      <button class="quiet" id="nextDay" aria-label="다음 날 보기">›</button>
    </div>

    <p class="day-label" id="dayLabel">오늘 먹은 양</p>
    <div class="kcal-line">
      <div class="kcal"><span id="kcal">0</span><span class="kcal-unit">kcal</span><span class="delta" id="kcalDelta" aria-hidden="true"></span></div>
      <div class="kcal-meta">목표 <span id="kcalTarget">2000</span>kcal · <span id="count">0</span>끼 기록</div>
    </div>
    <ul class="strands" id="bars" aria-label="영양소 목표 달성"></ul>
  </div>
</header>

<main class="wrap">
  <section class="log-panel" aria-labelledby="logTitle">
    <h2 id="logTitle">무엇을 먹었나요?</h2>
    <form id="aiForm" class="ai-form">
      <input id="aiText" maxlength="300" required autocomplete="off"
             placeholder="예: 김치찌개 한 그릇이랑 밥 반 공기"
             aria-label="먹은 음식 설명">
      <button type="submit" id="aiSubmit">AI로 기록</button>
    </form>
    <fieldset class="meal-pick" id="aiMealPick">
      <legend class="sr-only">기록할 끼니</legend>
      <label><input type="radio" name="aiMeal" value="BREAKFAST"><span>아침</span></label>
      <label><input type="radio" name="aiMeal" value="LUNCH"><span>점심</span></label>
      <label><input type="radio" name="aiMeal" value="DINNER"><span>저녁</span></label>
      <label><input type="radio" name="aiMeal" value="SNACK"><span>간식</span></label>
    </fieldset>
    <p class="ai-note">Google Gemini 무료 등급으로 양과 영양소를 추정해요. 입력한 문장은 Google 서비스 개선에 쓰일 수 있어요.</p>
    <div class="info" id="aiInfo" role="status" aria-live="polite"></div>

    <details class="manual" id="manual">
      <summary>등록된 음식에서 직접 고르기</summary>
      <form id="mealForm" class="meal-form">
        <select id="food" required aria-label="음식"></select>
        <select id="mealType" aria-label="끼니">
          <option value="BREAKFAST">아침</option>
          <option value="LUNCH">점심</option>
          <option value="DINNER">저녁</option>
          <option value="SNACK">간식</option>
        </select>
        <input type="number" id="grams" placeholder="g" min="1" max="5000" required aria-label="먹은 양(g)">
        <button type="submit">추가</button>
      </form>
      <div class="error" id="mealError"></div>
    </details>
  </section>

  <div class="day-grid">
    <section aria-labelledby="mealsTitle">
      <h2 class="section-title" id="mealsTitle">기록</h2>
      <div id="meals"></div>
    </section>

    <section class="recommend" id="recommendBox" aria-labelledby="recommendTitle">
      <h2 class="section-title" id="recommendTitle">다음 끼니 추천</h2>
      <div id="recommend">추천을 계산하고 있어요…</div>
      <div class="info" id="recommendInfo" role="status" aria-live="polite"></div>
    </section>
  </div>

  <section class="manage" aria-labelledby="manageTitle">
    <h2 class="section-title" id="manageTitle">목표와 음식 관리</h2>

    <details class="fold">
      <summary>내 하루 목표 <small id="targetSummary"></small></summary>
      <div class="fold-body">
        <form id="targetForm" class="target-form">
          <label class="field">칼로리(kcal)<input type="number" id="tKcal" min="500" max="10000" step="1" required></label>
          <label class="field">탄수화물(g)<input type="number" id="tCarb" min="1" max="1000" step="0.1" required></label>
          <label class="field">단백질(g)<input type="number" id="tProtein" min="1" max="500" step="0.1" required></label>
          <label class="field">지방(g)<input type="number" id="tFat" min="1" max="500" step="0.1" required></label>
          <button type="submit">목표 저장</button>
        </form>
        <div class="error" id="targetError"></div>
      </div>
    </details>

    <details class="fold">
      <summary>식약처 데이터에서 음식 찾기</summary>
      <div class="fold-body">
        <form id="publicForm" class="public-form">
          <input id="publicKeyword" placeholder="예: 사과, 김치찌개" required aria-label="찾을 음식 이름">
          <button type="submit">검색</button>
        </form>
        <div class="error" id="publicError"></div>
        <table>
          <thead><tr><th>음식</th><th class="num">kcal</th><th class="num">탄·단·지(g)</th><th></th></tr></thead>
          <tbody id="publicResults"></tbody>
        </table>
      </div>
    </details>

    <details class="fold">
      <summary>음식 직접 등록 <small>100g 기준</small></summary>
      <div class="fold-body">
        <form id="foodForm" class="food-form">
          <input id="foodName" placeholder="이름" required aria-label="음식 이름">
          <input type="number" id="foodKcal" placeholder="kcal" min="0" max="900" step="0.1" required aria-label="100g당 칼로리">
          <input type="number" id="foodCarb" placeholder="탄수화물 g" min="0" max="100" step="0.1" required aria-label="100g당 탄수화물">
          <input type="number" id="foodProtein" placeholder="단백질 g" min="0" max="100" step="0.1" required aria-label="100g당 단백질">
          <input type="number" id="foodFat" placeholder="지방 g" min="0" max="100" step="0.1" required aria-label="100g당 지방">
          <button type="submit">등록</button>
        </form>
        <div class="error" id="foodError"></div>
      </div>
    </details>
  </section>
</main>

<script>
  const MEAL_NAMES = { BREAKFAST: "아침", LUNCH: "점심", DINNER: "저녁", SNACK: "간식" };
  const MEAL_ORDER = ["BREAKFAST", "LUNCH", "DINNER", "SNACK"];
  const $ = (id) => document.getElementById(id);
  const dateInput = $("date");
  let me = null;             // 로그인한 회원 정보와 목표
  let publicResults = [];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const today = kst.toISOString().slice(0, 10);
  dateInput.value = today;
  dateInput.max = today;

  const fmt = (n) => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 1 });
  const NUTRIENT_KEYS = { "탄수화물": "carbohydrate", "단백질": "protein", "지방": "fat" };
  const STRAND_KEYS = { "탄수화물": "carb", "단백질": "protein", "지방": "fat" };

  // 지금 시각(한국)에 맞는 끼니를 기본값으로
  function currentMealType() {
    const hour = kst.getUTCHours();
    if (hour < 10) return "BREAKFAST";
    if (hour < 15) return "LUNCH";
    if (hour < 21) return "DINNER";
    return "SNACK";
  }
  let currentRec = null;

  // AI 기록 끼니 선택(라디오 버튼)
  const aiMeal = () => document.querySelector('input[name="aiMeal"]:checked').value;
  const setAiMeal = (value) => { document.querySelector(`input[name="aiMeal"][value="${value}"]`).checked = true; };

  // 모든 API 호출은 이 함수로: 로그인이 풀렸으면(401) 로그인 화면으로 이동
  async function api(url, options) {
    const res = await fetch(url, options);
    if (res.status === 401) {
      location.href = "/login.html";
      throw new Error("로그인이 필요해요");
    }
    return res;
  }

  async function errorText(res) {
    try {
      const err = await res.json();
      const details = Object.values(err.errors || {}).join(", ");
      return details || err.message || `요청 실패 (${res.status})`;
    } catch {
      return `요청 실패 (${res.status})`;
    }
  }

  async function loadMe() {
    me = await (await api("/me")).json();
    $("username").textContent = me.username;
    $("kcalTarget").textContent = fmt(Math.round(me.targetKcal));
    $("tKcal").value = me.targetKcal;
    $("tCarb").value = me.targetCarbohydrate;
    $("tProtein").value = me.targetProtein;
    $("tFat").value = me.targetFat;
    $("targetSummary").textContent =
        `${fmt(me.targetKcal)}kcal · 탄 ${fmt(me.targetCarbohydrate)}g · 단 ${fmt(me.targetProtein)}g · 지 ${fmt(me.targetFat)}g`;
  }

  async function loadFoods() {
    const foods = await (await api("/foods")).json();
    $("food").innerHTML = foods
      .map((f) => `<option value="${f.id}">${esc(f.name)} (100g당 ${f.kcalPer100g}kcal)</option>`)
      .join("");
  }

  // 날짜 표시: 오늘이면 "오늘 먹은 양", 다른 날이면 "10월 13일 (월) 먹은 양"
  function updateDayLabel() {
    const date = dateInput.value;
    if (date === today) {
      $("dayLabel").textContent = "오늘 먹은 양";
    } else {
      const d = new Date(`${date}T00:00:00`);
      const label = d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
      $("dayLabel").textContent = `${label} 먹은 양`;
    }
    $("nextDay").disabled = date >= today;
  }

  // animate: 내가 방금 바꾼 기록 때문에 서버가 다시 계산한 경우에만 변화를 보여줌 (첫 로딩·날짜 변경은 조용히)
  async function loadDay({ animate = false } = {}) {
    const date = dateInput.value;
    updateDayLabel();
    const [meals, summary, recText] = await Promise.all([
      api(`/meals?date=${date}`).then((r) => r.json()),
      api(`/summary?date=${date}`).then((r) => r.json()),
      api(`/recommendation?date=${date}`).then((r) => r.text()),
    ]);
    renderSummary(summary, animate);
    renderRecommend(recText ? JSON.parse(recText) : null, summary, date, animate);
    renderMeals(meals);
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let shownKcal = 0;
  let kcalFrame = 0;

  // 이전 값에서 새 값으로 숫자를 굴림 (동작 줄이기 설정이면 바로 바꿈)
  function tweenKcal(to, animate) {
    cancelAnimationFrame(kcalFrame);
    const from = shownKcal;
    shownKcal = to;
    if (!animate || reduceMotion.matches || from === to) {
      $("kcal").textContent = fmt(to);
      return;
    }
    const start = performance.now();
    const duration = 700;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(2, -10 * t);   // ease-out expo
      $("kcal").textContent = fmt(Math.round(from + (to - from) * (t === 1 ? 1 : eased)));
      if (t < 1) kcalFrame = requestAnimationFrame(step);
    };
    kcalFrame = requestAnimationFrame(step);
  }

  function showDelta(diff) {
    const chip = $("kcalDelta");
    chip.classList.remove("show", "minus");
    if (diff === 0) return;
    chip.textContent = `${diff > 0 ? "+" : "−"}${fmt(Math.abs(diff))}`;
    chip.classList.toggle("minus", diff < 0);
    void chip.offsetWidth;   // 같은 애니메이션을 연달아 다시 시작하기 위해
    chip.classList.add("show");
  }

  function renderSummary(s, animate) {
    const targets = [
      { key: "totalCarbohydrate", name: "탄수화물", strand: "carb", target: me.targetCarbohydrate },
      { key: "totalProtein", name: "단백질", strand: "protein", target: me.targetProtein },
      { key: "totalFat", name: "지방", strand: "fat", target: me.targetFat },
    ];
    const kcal = Math.round(s.totalKcal);
    if (animate) showDelta(kcal - shownKcal);
    tweenKcal(kcal, animate);
    $("count").textContent = s.mealCount;

    // 가닥은 한 번만 만들고 값만 바꿔야 이전 길이에서 새 길이로 자라남
    if ($("bars").children.length !== targets.length) {
      $("bars").innerHTML = targets.map((t) => `
        <li class="strand" data-n="${t.strand}">
          <span class="strand-name">${t.name}</span>
          <div class="strand-track"><div class="strand-fill"></div></div>
          <span class="strand-value"></span>
        </li>`).join("");
    }
    targets.forEach((t, i) => {
      const row = $("bars").children[i];
      const value = s[t.key];
      const percent = Math.min(100, (value / t.target) * 100);
      row.querySelector(".strand-value").innerHTML = `<b>${fmt(value)}</b> / ${fmt(t.target)}g`;
      row.querySelector(".strand-fill").style.setProperty("--p", `${percent}%`);
    });
  }

  const recKey = (r) => (r ? `${r.food.id}:${r.grams}` : "none");

  function renderRecommend(rec, summary, date, animate) {
    const isPast = date < today;
    const day = isPast ? "이날" : "오늘";
    $("recommendTitle").textContent = isPast ? "이날 더 먹었으면 좋았을 음식" : "다음 끼니 추천";
    const changed = recKey(rec) !== recKey(currentRec);
    currentRec = rec;

    // 추천이 실제로 바뀌었을 때만 근거를 다시 펼침
    const box = $("recommend");
    box.classList.remove("recalc");
    if (animate && changed) {
      void box.offsetWidth;
      box.classList.add("recalc");
    }

    if (!rec) {
      delete $("recommendBox").dataset.n;
      // 서버는 칼로리를 다 채웠거나, 세 영양소를 모두 채웠거나, 고를 음식이 없거나, 추천량이 1g 미만이면 추천하지 않음
      const macrosMet = summary.totalCarbohydrate >= me.targetCarbohydrate
          && summary.totalProtein >= me.targetProtein && summary.totalFat >= me.targetFat;
      const message = summary.totalKcal >= me.targetKcal
          ? `${day} 목표 칼로리 ${fmt(me.targetKcal)}kcal를 다 채웠어요. 더 추천할 음식은 없어요.`
          : macrosMet
              ? `${day} 탄수화물·단백질·지방 목표를 모두 채웠어요.`
              : "지금은 따로 추천할 음식이 없어요. 남은 영양소가 아주 적거나, 그 영양소가 든 음식이 아직 등록되지 않았어요.";
      box.innerHTML = `<p class="rec-head">${message}</p>`;
      return;
    }

    $("recommendBox").dataset.n = STRAND_KEYS[rec.nutrient] || "";
    const name = esc(rec.food.name);
    const picked = rec.shortfalls.find((s) => s.nutrient === rec.nutrient);
    const per100 = rec.food[NUTRIENT_KEYS[rec.nutrient]];
    const rows = rec.shortfalls.map((s) => {
      const isPick = s.nutrient === rec.nutrient;
      const detail = s.lack > 0
          ? `목표 ${fmt(s.target)}g 중 ${fmt(s.lack)}g 부족${isPick ? '<span class="sr-only"> (가장 부족해요)</span>' : ""}`
          : `목표 ${fmt(s.target)}g 채움`;
      const percent = s.ratio > 0 ? `${Math.round(s.ratio * 100)}%` : "0%";
      return `<li${isPick ? ' class="pick"' : ""}><span>${s.nutrient}</span><span>${detail}</span><span>${percent}</span></li>`;
    }).join("");
    const amount = rec.capped
        ? `<span class="note">남은 칼로리 ${fmt(Math.round(rec.remainingKcal))}kcal에 맞춰 ${fmt(rec.grams)}g으로 줄였어요.</span>`
        : `<span class="note">남은 칼로리 ${fmt(Math.round(rec.remainingKcal))}kcal 안이라 그대로 추천해요.</span>`;

    box.innerHTML = `
      <p class="rec-head"><strong>${name} ${fmt(rec.grams)}g</strong>
        <span class="rec-kcal">${fmt(Math.round(rec.kcal))}kcal · ${esc(rec.reason)}</span></p>
      <ol class="rec-steps">
        <li><span class="rec-step">1. 목표 대비 가장 부족한 영양소</span><ul class="shortfalls">${rows}</ul></li>
        <li><span class="rec-step">2. ${rec.nutrient}이 가장 많이 든 음식</span>
          <span class="rec-calc">${name} · 100g당 ${rec.nutrient} ${fmt(per100)}g</span></li>
        <li><span class="rec-step">3. 추천량 계산</span>
          <span class="rec-calc">${fmt(picked.lack)}g ÷ ${fmt(per100)}g × 100 = ${fmt(rec.neededGrams)}g${amount}</span></li>
      </ol>
      <form id="recForm" class="rec-add">
        <select id="recMealType" aria-label="기록할 끼니">
          ${Object.entries(MEAL_NAMES).map(([value, label]) =>
              `<option value="${value}"${value === currentMealType() ? " selected" : ""}>${label}</option>`).join("")}
        </select>
        <button type="submit">이대로 기록</button>
      </form>`;
  }

  // 기록은 끼니별로 묶어서 보여줌 (끼니마다 칼로리 합계)
  function renderMeals(meals) {
    if (meals.length === 0) {
      const hint = dateInput.value === today ? " 위 칸에 먹은 걸 적어 보세요." : "";
      $("meals").innerHTML = `<p class="empty">아직 기록이 없어요.${hint}</p>`;
      return;
    }
    const kcalOf = (m) => Math.round(m.food.kcalPer100g * m.grams / 100);
    $("meals").innerHTML = MEAL_ORDER
      .map((type) => {
        const group = meals.filter((m) => m.mealType === type);
        if (group.length === 0) return "";
        const total = group.reduce((sum, m) => sum + kcalOf(m), 0);
        return `
          <div class="meal-group">
            <div class="meal-head"><h3>${MEAL_NAMES[type]}</h3><span>${fmt(total)}kcal</span></div>
            <ul class="entries">${group.map((m) => `
              <li class="entry">
                <span class="entry-name">${esc(m.food.name)}${m.food.source === "AI" ? '<span class="tag" title="AI가 추정한 영양 정보예요">AI 추정</span>' : ""}</span>
                <span class="entry-num grams-col">${fmt(m.grams)}g</span>
                <span class="entry-num kcal-col">${fmt(kcalOf(m))}kcal</span>
                <button class="del" onclick="deleteMeal(${m.id})" aria-label="${esc(m.food.name)} 기록 삭제">삭제</button>
              </li>`).join("")}
            </ul>
          </div>`;
      })
      .join("");
  }

  async function deleteMeal(id) {
    if (!confirm("이 기록을 삭제할까요?")) return;
    await api(`/meals/${id}`, { method: "DELETE" });
    loadDay({ animate: true });
  }

  async function createFood(food) {
    const res = await api("/foods", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(food),
    });
    if (!res.ok) throw new Error(await errorText(res));
    const saved = await res.json();
    await loadFoods();
    $("food").value = saved.id;
    return saved;
  }

  // 로그아웃
  $("logout").addEventListener("click", async () => {
    await fetch("/logout", { method: "POST" });
    location.href = "/login.html";
  });

  // 날짜 이동 (하루씩)
  function shiftDay(days) {
    const d = new Date(`${dateInput.value}T00:00:00Z`);
    d.setUTCDate(d.getUTCDate() + days);
    const next = d.toISOString().slice(0, 10);
    if (next > today) return;
    dateInput.value = next;
    dateInput.dispatchEvent(new Event("change"));
  }
  $("prevDay").addEventListener("click", () => shiftDay(-1));
  $("nextDay").addEventListener("click", () => shiftDay(1));

  // 식사 기록 추가 (직접 고르기)
  $("mealType").value = currentMealType();
  $("mealForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("mealError").textContent = "";
    const res = await api("/meals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        date: dateInput.value,
        mealType: $("mealType").value,
        foodId: Number($("food").value),
        grams: Number($("grams").value),
      }),
    });
    if (!res.ok) {
      $("mealError").textContent = await errorText(res);
      return;
    }
    $("grams").value = "";
    loadDay({ animate: true });
  });

  // AI로 기록: 문장을 서버에 보내면 서버가 Gemini로 분석해서 음식별로 저장
  setAiMeal(currentMealType());
  $("aiForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("aiText").value.trim();
    if (!text) return;
    const button = $("aiSubmit");
    const info = $("aiInfo");
    const mealType = aiMeal();
    button.disabled = true;
    button.textContent = "분석 중…";
    info.className = "info";
    info.textContent = "";
    $("food").classList.remove("highlight");

    try {
      const res = await api("/meals/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: dateInput.value, mealType, text }),
      });

      if (res.status === 503) {
        // AI를 쓸 수 없음(키 없음, 무료 한도 초과 등) → 바로 아래 직접 고르기를 펼쳐서 안내
        info.className = "error";
        info.textContent = await errorText(res);
        $("manual").open = true;
        $("mealType").value = mealType;
        $("food").classList.add("highlight");
        $("food").focus();
        return;
      }
      if (!res.ok) {
        info.className = "error";
        info.textContent = await errorText(res);
        return;
      }

      const saved = await res.json();
      $("aiText").value = "";
      await loadFoods();                  // AI가 새로 만든 음식도 직접 고르기 목록에 나타나게
      await loadDay({ animate: true });
      const list = saved.map((m) => `${m.food.name} ${fmt(m.grams)}g`).join(", ");
      info.className = "info";
      info.textContent = `${MEAL_NAMES[mealType]}으로 ${list}을 기록했어요. 양이 다르면 기록을 지우고 직접 추가해 주세요.`;
    } catch (err) {
      info.className = "error";
      info.textContent = err.message;
    } finally {
      button.disabled = false;
      button.textContent = "AI로 기록";
    }
  });

  // 추천을 그대로 기록 (폼이 다시 그려지므로 카드에서 이벤트를 받음)
  $("recommend").addEventListener("submit", async (e) => {
    if (e.target.id !== "recForm" || !currentRec) return;
    e.preventDefault();
    const rec = currentRec;
    const mealType = $("recMealType").value;
    const button = e.target.querySelector("button");
    button.disabled = true;
    $("recommendInfo").textContent = "";
    const res = await api("/meals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: dateInput.value, mealType, foodId: rec.food.id, grams: rec.grams }),
    });
    if (!res.ok) {
      button.disabled = false;
      $("recommendInfo").className = "error";
      $("recommendInfo").textContent = await errorText(res);
      return;
    }
    await loadDay({ animate: true });
    $("recommendInfo").className = "info";
    $("recommendInfo").textContent =
        `${rec.food.name} ${fmt(rec.grams)}g을 ${MEAL_NAMES[mealType]}으로 기록했어요. 요약과 추천을 다시 계산했어요.`;
  });

  // 목표 저장
  $("targetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("targetError").textContent = "";
    const res = await api("/me/targets", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kcal: Number($("tKcal").value),
        carbohydrate: Number($("tCarb").value),
        protein: Number($("tProtein").value),
        fat: Number($("tFat").value),
      }),
    });
    if (!res.ok) {
      $("targetError").textContent = await errorText(res);
      return;
    }
    await loadMe();
    loadDay({ animate: true });   // 새 목표로 가닥과 추천 다시 계산
  });

  // 공공 데이터 검색
  $("publicForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("publicError").textContent = "";
    $("publicResults").innerHTML = `<tr><td colspan="4" class="empty-cell">찾는 중…</td></tr>`;
    const keyword = encodeURIComponent($("publicKeyword").value.trim());
    const res = await api(`/foods/public?keyword=${keyword}`);
    if (!res.ok) {
      $("publicResults").innerHTML = "";
      $("publicError").textContent = await errorText(res);
      return;
    }
    publicResults = await res.json();
    if (publicResults.length === 0) {
      $("publicResults").innerHTML = `<tr><td colspan="4" class="empty-cell">검색 결과가 없어요. 다른 이름으로 찾아보세요.</td></tr>`;
      return;
    }
    $("publicResults").innerHTML = publicResults.map((f, i) => `
      <tr>
        <td>${esc(f.name)}
          <span class="sub">${esc([f.maker, f.basis && `${f.basis} 기준`].filter(Boolean).join(" · "))}</span>
        </td>
        <td class="num">${f.kcal}</td>
        <td class="num">${f.carbohydrate} · ${f.protein} · ${f.fat}</td>
        <td class="num"><button class="import" onclick="importFood(${i}, this)">가져오기</button></td>
      </tr>`).join("");
  });

  async function importFood(index, button) {
    const f = publicResults[index];
    $("publicError").textContent = "";
    button.disabled = true;
    try {
      await createFood({
        name: f.name.slice(0, 50),
        kcalPer100g: f.kcal,
        carbohydrate: f.carbohydrate,
        protein: f.protein,
        fat: f.fat,
      });
      button.textContent = "가져옴";
    } catch (err) {
      $("publicError").textContent = err.message;
      button.disabled = false;
    }
  }

  // 음식 직접 등록
  $("foodForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("foodError").textContent = "";
    try {
      await createFood({
        name: $("foodName").value,
        kcalPer100g: Number($("foodKcal").value),
        carbohydrate: Number($("foodCarb").value),
        protein: Number($("foodProtein").value),
        fat: Number($("foodFat").value),
      });
      $("foodForm").reset();
    } catch (err) {
      $("foodError").textContent = err.message;
    }
  });

  dateInput.addEventListener("change", () => {
    if (!dateInput.value || dateInput.value > today) dateInput.value = today;
    $("recommendInfo").textContent = "";
    loadDay();
  });

  loadMe().then(loadFoods).then(loadDay);
</script>
</body>
</html>
