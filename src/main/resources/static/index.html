<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식단 자동화</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1f2421; --muted: #6b716d;
    --line: #e4e0d8; --accent: #2f6f4f; --accent-soft: #e3efe8; --danger: #b4443a;
    --rec-muted: #4d6457; --rec-line: #c9dccf;
    --carb: #d9a441; --protein: #2f6f4f; --fat: #b06a3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  h2 { margin: 0 0 14px; font-size: 16px; color: var(--muted); font-weight: 600; }
  input, select, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; min-width: 0; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .ghost { background: none; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .kcal { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .kcal small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .bars { display: grid; gap: 10px; margin-top: 16px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0 round 4px);
               transition: clip-path 700ms var(--ease-out); }
  .bar-value { font-variant-numeric: tabular-nums; }

  /* 서버 재계산을 보여주는 움직임: 숫자는 굴러가고, 증감 칩이 떠올랐다 사라짐 */
  :root { --ease-out: cubic-bezier(0.16, 1, 0.3, 1); }
  .kcal { position: relative; font-variant-numeric: tabular-nums; }
  .delta { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px; vertical-align: 10px;
           font-size: 14px; font-weight: 600; letter-spacing: 0; color: var(--accent); background: var(--accent-soft);
           opacity: 0; pointer-events: none; }
  .delta.minus { color: var(--rec-muted); background: var(--line); }
  .delta.show { animation: delta-pop 2400ms var(--ease-out) forwards; }
  @keyframes delta-pop {
    0% { opacity: 0; transform: translateY(8px); }
    12% { opacity: 1; transform: translateY(0); }
    75% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-4px); }
  }
  button { transition: transform 120ms var(--ease-out), opacity 150ms; }
  button:active:not(:disabled) { transform: scale(0.97); }
  .recommend { background: var(--accent-soft); border-color: transparent; }
  .recommend { word-break: keep-all; }
  .recommend h2 { color: var(--rec-muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .rec-head { margin: 0; font-size: 17px; }
  .rec-head strong { font-size: 24px; letter-spacing: -0.5px; }
  .rec-kcal { display: block; margin-top: 2px; color: var(--rec-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rec-steps { list-style: none; margin: 18px 0 0; padding: 16px 0 0; border-top: 1px solid var(--rec-line); display: grid; gap: 14px; }
  .rec-steps > li { display: grid; gap: 6px; }
  .rec-step { font-size: 13px; font-weight: 600; color: var(--rec-muted); }
  .rec-calc { font-variant-numeric: tabular-nums; }
  .rec-calc .note { display: block; margin-top: 2px; color: var(--rec-muted); font-size: 14px; }
  .shortfalls { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .shortfalls li { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 10px; align-items: baseline;
                   font-size: 14px; color: var(--rec-muted); font-variant-numeric: tabular-nums; }
  .shortfalls li.pick { color: var(--text); font-weight: 600; }
  .shortfalls li { margin: 0 -6px; padding: 2px 6px; border-radius: 6px; }

  /* 추천이 바뀌면: 근거 단계가 위에서 아래로 펼쳐지고, 새로 고른 영양소가 잠깐 물듦 */
  .recalc .rec-head { animation: rec-in 450ms var(--ease-out) both; }
  .recalc .rec-steps { animation: rec-unroll 650ms var(--ease-out) 80ms both; }
  .recalc .shortfalls li.pick { animation: pick-wash 1600ms ease-out 350ms both; }
  @keyframes rec-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes rec-unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes pick-wash { from { background: rgba(47, 111, 79, 0.2); } to { background: rgba(47, 111, 79, 0); } }

  @media (prefers-reduced-motion: reduce) {
    .bar > div { transition: none; }
    .delta.show { animation-name: delta-fade; }
    @keyframes delta-fade { 0% { opacity: 0; } 10%, 75% { opacity: 1; } 100% { opacity: 0; } }
    .recalc .rec-head { animation-name: rec-fade; }
    .recalc .rec-steps { animation: none; }
    @keyframes rec-fade { from { opacity: 0; } to { opacity: 1; } }
    button { transition: none; }
    button:active:not(:disabled) { transform: none; }
  }
  .rec-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .rec-add select { flex: 0 0 auto; }
  .recommend .info { color: var(--accent); }
  form { display: grid; gap: 8px; }
  .meal-form { grid-template-columns: 1fr 1fr 110px auto; }
  .food-form { grid-template-columns: 2fr repeat(4, 1fr) auto; }
  .target-form { grid-template-columns: repeat(4, 1fr) auto; }
  .public-form { grid-template-columns: 1fr auto; }
  .ai-form { grid-template-columns: 1fr 110px auto; }
  .ai-form input { width: 100%; }
  .ai-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; word-break: keep-all; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 12px; color: var(--muted); font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
         font-size: 11px; font-weight: 600; color: var(--rec-muted); background: var(--accent-soft); }
  #food.highlight { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sub { display: block; color: var(--muted); font-size: 12px; }
  .del { background: none; color: var(--danger); padding: 4px 8px; }
  .import { padding: 5px 10px; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  .error { color: var(--danger); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .info { color: var(--accent); font-size: 14px; margin-top: 8px; min-height: 18px; }
  @media (max-width: 560px) {
    .meal-form, .food-form, .target-form { grid-template-columns: 1fr 1fr; }
    .ai-form { grid-template-columns: 1fr auto; }
    .ai-form input { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘의 식단</h1>
    <div class="user">
      <span id="username"></span>님
      <button class="ghost" id="logout">로그아웃</button>
      <input type="date" id="date">
    </div>
  </header>

  <section class="card">
    <h2>하루 요약</h2>
    <div class="kcal"><span id="kcal">0</span><span class="delta" id="kcalDelta" aria-hidden="true"></span> <small>/ <span id="kcalTarget">2000</span> kcal · <span id="count">0</span>끼</small></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card recommend">
    <h2 id="recommendTitle">다음 끼니 추천</h2>
    <div id="recommend">추천을 계산하고 있어요…</div>
    <div class="info" id="recommendInfo" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <h2>식사 기록 추가</h2>
    <form id="aiForm" class="ai-form">
      <input id="aiText" maxlength="300" required autocomplete="off"
             placeholder="먹은 걸 그대로 적어 주세요. 예: 김치찌개 한 그릇이랑 밥 반 공기"
             aria-label="먹은 음식 설명">
      <select id="aiMealType" aria-label="기록할 끼니">
        <option value="BREAKFAST">아침</option>
        <option value="LUNCH">점심</option>
        <option value="DINNER">저녁</option>
        <option value="SNACK">간식</option>
      </select>
      <button type="submit" id="aiSubmit">AI로 기록</button>
    </form>
    <p class="ai-note">Google Gemini 무료 등급으로 양과 영양소를 추정해요. 입력한 문장은 Google 서비스 개선에 쓰일 수 있어요.</p>
    <div class="info" id="aiInfo" role="status" aria-live="polite"></div>

    <div class="divider">또는 음식 직접 선택</div>
    <form id="mealForm" class="meal-form">
      <select id="food" required></select>
      <select id="mealType">
        <option value="BREAKFAST">아침</option>
        <option value="LUNCH">점심</option>
        <option value="DINNER">저녁</option>
        <option value="SNACK">간식</option>
      </select>
      <input type="number" id="grams" placeholder="g" min="1" max="5000" required>
      <button type="submit">추가</button>
    </form>
    <div class="error" id="mealError"></div>
  </section>

  <section class="card">
    <h2>기록</h2>
    <table>
      <thead><tr><th>끼니</th><th>음식</th><th class="num">섭취량</th><th class="num">칼로리</th><th></th></tr></thead>
      <tbody id="meals"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>내 하루 목표</h2>
    <form id="targetForm" class="target-form">
      <label class="field">칼로리(kcal)<input type="number" id="tKcal" min="500" max="10000" step="1" required></label>
      <label class="field">탄수화물(g)<input type="number" id="tCarb" min="1" max="1000" step="0.1" required></label>
      <label class="field">단백질(g)<input type="number" id="tProtein" min="1" max="500" step="0.1" required></label>
      <label class="field">지방(g)<input type="number" id="tFat" min="1" max="500" step="0.1" required></label>
      <button type="submit" style="align-self:end">저장</button>
    </form>
    <div class="error" id="targetError"></div>
  </section>

  <section class="card">
    <h2>공공 데이터에서 음식 찾기 (식약처)</h2>
    <form id="publicForm" class="public-form">
      <input id="publicKeyword" placeholder="예: 사과, 김치찌개" required>
      <button type="submit">검색</button>
    </form>
    <div class="error" id="publicError"></div>
    <table>
      <thead><tr><th>음식</th><th class="num">kcal</th><th class="num">탄·단·지(g)</th><th></th></tr></thead>
      <tbody id="publicResults"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>음식 직접 등록 (100g 기준)</h2>
    <form id="foodForm" class="food-form">
      <input id="foodName" placeholder="이름" required>
      <input type="number" id="foodKcal" placeholder="kcal" min="0" max="900" step="0.1" required>
      <input type="number" id="foodCarb" placeholder="탄수화물 g" min="0" max="100" step="0.1" required>
      <input type="number" id="foodProtein" placeholder="단백질 g" min="0" max="100" step="0.1" required>
      <input type="number" id="foodFat" placeholder="지방 g" min="0" max="100" step="0.1" required>
      <button type="submit">등록</button>
    </form>
    <div class="error" id="foodError"></div>
  </section>
</main>

<script>
  const MEAL_NAMES = { BREAKFAST: "아침", LUNCH: "점심", DINNER: "저녁", SNACK: "간식" };
  const $ = (id) => document.getElementById(id);
  const dateInput = $("date");
  let me = null;             // 로그인한 회원 정보와 목표
  let publicResults = [];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const kst = new Date(Date.now() + 9 * 3600 * 1000);
  const today = kst.toISOString().slice(0, 10);
  dateInput.value = today;

  const fmt = (n) => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 1 });
  const NUTRIENT_KEYS = { "탄수화물": "carbohydrate", "단백질": "protein", "지방": "fat" };

  // 지금 시각(한국)에 맞는 끼니를 기본값으로
  function currentMealType() {
    const hour = kst.getUTCHours();
    if (hour < 10) return "BREAKFAST";
    if (hour < 15) return "LUNCH";
    if (hour < 21) return "DINNER";
    return "SNACK";
  }
  let currentRec = null;

  // 모든 API 호출은 이 함수로: 로그인이 풀렸으면(401) 로그인 화면으로 이동
  async function api(url, options) {
    const res = await fetch(url, options);
    if (res.status === 401) {
      location.href = "/login.html";
      throw new Error("로그인이 필요해요");
    }
    return res;
  }

  async function errorText(res) {
    try {
      const err = await res.json();
      const details = Object.values(err.errors || {}).join(", ");
      return details || err.message || `요청 실패 (${res.status})`;
    } catch {
      return `요청 실패 (${res.status})`;
    }
  }

  async function loadMe() {
    me = await (await api("/me")).json();
    $("username").textContent = me.username;
    $("kcalTarget").textContent = Math.round(me.targetKcal);
    $("tKcal").value = me.targetKcal;
    $("tCarb").value = me.targetCarbohydrate;
    $("tProtein").value = me.targetProtein;
    $("tFat").value = me.targetFat;
  }

  async function loadFoods() {
    const foods = await (await api("/foods")).json();
    $("food").innerHTML = foods
      .map((f) => `<option value="${f.id}">${esc(f.name)} (100g당 ${f.kcalPer100g}kcal)</option>`)
      .join("");
  }

  // animate: 내가 방금 바꾼 기록 때문에 서버가 다시 계산한 경우에만 변화를 보여줌 (첫 로딩·날짜 변경은 조용히)
  async function loadDay({ animate = false } = {}) {
    const date = dateInput.value;
    const [meals, summary, recText] = await Promise.all([
      api(`/meals?date=${date}`).then((r) => r.json()),
      api(`/summary?date=${date}`).then((r) => r.json()),
      api(`/recommendation?date=${date}`).then((r) => r.text()),
    ]);
    renderSummary(summary, animate);
    renderRecommend(recText ? JSON.parse(recText) : null, summary, date, animate);
    renderMeals(meals);
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let shownKcal = 0;
  let kcalFrame = 0;

  // 이전 값에서 새 값으로 숫자를 굴림 (동작 줄이기 설정이면 바로 바꿈)
  function tweenKcal(to, animate) {
    cancelAnimationFrame(kcalFrame);
    const from = shownKcal;
    shownKcal = to;
    if (!animate || reduceMotion.matches || from === to) {
      $("kcal").textContent = fmt(to);
      return;
    }
    const start = performance.now();
    const duration = 700;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(2, -10 * t);   // ease-out expo
      $("kcal").textContent = fmt(Math.round(from + (to - from) * (t === 1 ? 1 : eased)));
      if (t < 1) kcalFrame = requestAnimationFrame(step);
    };
    kcalFrame = requestAnimationFrame(step);
  }

  function showDelta(diff) {
    const chip = $("kcalDelta");
    chip.classList.remove("show", "minus");
    if (diff === 0) return;
    chip.textContent = `${diff > 0 ? "+" : "−"}${fmt(Math.abs(diff))}kcal`;
    chip.classList.toggle("minus", diff < 0);
    void chip.offsetWidth;   // 같은 애니메이션을 연달아 다시 시작하기 위해
    chip.classList.add("show");
  }

  function renderSummary(s, animate) {
    const targets = [
      { key: "totalCarbohydrate", name: "탄수화물", target: me.targetCarbohydrate, color: "var(--carb)" },
      { key: "totalProtein", name: "단백질", target: me.targetProtein, color: "var(--protein)" },
      { key: "totalFat", name: "지방", target: me.targetFat, color: "var(--fat)" },
    ];
    const kcal = Math.round(s.totalKcal);
    if (animate) showDelta(kcal - shownKcal);
    tweenKcal(kcal, animate);
    $("count").textContent = s.mealCount;

    // 막대는 한 번만 만들고 값만 바꿔야 이전 길이에서 새 길이로 자라남
    if ($("bars").children.length !== targets.length) {
      $("bars").innerHTML = targets.map((t) => `
        <div>
          <div class="bar-label"><span>${t.name}</span><span class="bar-value"></span></div>
          <div class="bar"><div style="background:${t.color}"></div></div>
        </div>`).join("");
    }
    targets.forEach((t, i) => {
      const row = $("bars").children[i];
      const value = s[t.key];
      const percent = Math.min(100, (value / t.target) * 100);
      row.querySelector(".bar-value").textContent = `${value}g / ${t.target}g`;
      row.querySelector(".bar > div").style.setProperty("--p", `${percent}%`);
    });
  }

  const recKey = (r) => (r ? `${r.food.id}:${r.grams}` : "none");

  function renderRecommend(rec, summary, date, animate) {
    const isPast = date < today;
    const day = isPast ? "이날" : "오늘";
    $("recommendTitle").textContent = isPast ? "이날 더 먹었으면 좋았을 음식" : "다음 끼니 추천";
    const changed = recKey(rec) !== recKey(currentRec);
    currentRec = rec;

    // 추천이 실제로 바뀌었을 때만 근거를 다시 펼침
    const box = $("recommend");
    box.classList.remove("recalc");
    if (animate && changed) {
      void box.offsetWidth;
      box.classList.add("recalc");
    }

    if (!rec) {
      // 서버는 칼로리를 다 채웠거나, 세 영양소를 모두 채웠거나, 고를 음식이 없거나, 추천량이 1g 미만이면 추천하지 않음
      const macrosMet = summary.totalCarbohydrate >= me.targetCarbohydrate
          && summary.totalProtein >= me.targetProtein && summary.totalFat >= me.targetFat;
      const message = summary.totalKcal >= me.targetKcal
          ? `${day} 목표 칼로리 ${fmt(me.targetKcal)}kcal를 다 채웠어요. 더 추천할 음식은 없어요.`
          : macrosMet
              ? `${day} 탄수화물·단백질·지방 목표를 모두 채웠어요.`
              : "지금은 따로 추천할 음식이 없어요. 남은 영양소가 아주 적거나, 그 영양소가 든 음식이 아직 등록되지 않았어요.";
      box.innerHTML = `<p class="rec-head">${message}</p>`;
      return;
    }

    const name = esc(rec.food.name);
    const picked = rec.shortfalls.find((s) => s.nutrient === rec.nutrient);
    const per100 = rec.food[NUTRIENT_KEYS[rec.nutrient]];
    const rows = rec.shortfalls.map((s) => {
      const isPick = s.nutrient === rec.nutrient;
      const detail = s.lack > 0
          ? `목표 ${fmt(s.target)}g 중 ${fmt(s.lack)}g 부족${isPick ? '<span class="sr-only"> (가장 부족해요)</span>' : ""}`
          : `목표 ${fmt(s.target)}g 채움`;
      const percent = s.ratio > 0 ? `${Math.round(s.ratio * 100)}%` : "0%";
      return `<li${isPick ? ' class="pick"' : ""}><span>${s.nutrient}</span><span>${detail}</span><span>${percent}</span></li>`;
    }).join("");
    const amount = rec.capped
        ? `<span class="note">남은 칼로리 ${fmt(Math.round(rec.remainingKcal))}kcal에 맞춰 ${fmt(rec.grams)}g으로 줄였어요.</span>`
        : `<span class="note">남은 칼로리 ${fmt(Math.round(rec.remainingKcal))}kcal 안이라 그대로 추천해요.</span>`;

    $("recommend").innerHTML = `
      <p class="rec-head"><strong>${name} ${fmt(rec.grams)}g</strong> 어때요?
        <span class="rec-kcal">${fmt(Math.round(rec.kcal))}kcal · ${esc(rec.reason)}</span></p>
      <ol class="rec-steps">
        <li><span class="rec-step">1. 목표 대비 가장 부족한 영양소</span><ul class="shortfalls">${rows}</ul></li>
        <li><span class="rec-step">2. ${rec.nutrient}이 가장 많이 든 음식</span>
          <span class="rec-calc">${name} · 100g당 ${rec.nutrient} ${fmt(per100)}g</span></li>
        <li><span class="rec-step">3. 추천량 계산</span>
          <span class="rec-calc">${fmt(picked.lack)}g ÷ ${fmt(per100)}g × 100 = ${fmt(rec.neededGrams)}g${amount}</span></li>
      </ol>
      <form id="recForm" class="rec-add">
        <select id="recMealType" aria-label="기록할 끼니">
          ${Object.entries(MEAL_NAMES).map(([value, label]) =>
              `<option value="${value}"${value === currentMealType() ? " selected" : ""}>${label}</option>`).join("")}
        </select>
        <button type="submit">이대로 추가</button>
      </form>`;
  }

  function renderMeals(meals) {
    if (meals.length === 0) {
      $("meals").innerHTML = `<tr><td colspan="5" class="empty">아직 기록이 없어요</td></tr>`;
      return;
    }
    $("meals").innerHTML = meals.map((m) => `
      <tr>
        <td>${MEAL_NAMES[m.mealType]}</td>
        <td>${esc(m.food.name)}${m.food.source === "AI" ? '<span class="tag" title="AI가 추정한 영양 정보예요">AI 추정</span>' : ""}</td>
        <td class="num">${m.grams}g</td>
        <td class="num">${Math.round(m.food.kcalPer100g * m.grams / 100)}kcal</td>
        <td class="num"><button class="del" onclick="deleteMeal(${m.id})">삭제</button></td>
      </tr>`).join("");
  }

  async function deleteMeal(id) {
    if (!confirm("이 기록을 삭제할까요?")) return;
    await api(`/meals/${id}`, { method: "DELETE" });
    loadDay({ animate: true });
  }

  async function createFood(food) {
    const res = await api("/foods", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(food),
    });
    if (!res.ok) throw new Error(await errorText(res));
    const saved = await res.json();
    await loadFoods();
    $("food").value = saved.id;
    return saved;
  }

  // 로그아웃
  $("logout").addEventListener("click", async () => {
    await fetch("/logout", { method: "POST" });
    location.href = "/login.html";
  });

  // 식사 기록 추가
  $("mealForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("mealError").textContent = "";
    const res = await api("/meals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        date: dateInput.value,
        mealType: $("mealType").value,
        foodId: Number($("food").value),
        grams: Number($("grams").value),
      }),
    });
    if (!res.ok) {
      $("mealError").textContent = await errorText(res);
      return;
    }
    $("grams").value = "";
    loadDay({ animate: true });
  });

  // AI로 기록: 문장을 서버에 보내면 서버가 Gemini로 분석해서 음식별로 저장
  $("aiMealType").value = currentMealType();
  $("aiForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("aiText").value.trim();
    if (!text) return;
    const button = $("aiSubmit");
    const info = $("aiInfo");
    const mealType = $("aiMealType").value;
    button.disabled = true;
    button.textContent = "분석 중…";
    info.className = "info";
    info.textContent = "";
    $("food").classList.remove("highlight");

    try {
      const res = await api("/meals/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ date: dateInput.value, mealType, text }),
      });

      if (res.status === 503) {
        // AI를 쓸 수 없음(키 없음, 무료 한도 초과 등) → 바로 아래 직접 선택으로 안내
        info.className = "error";
        info.textContent = await errorText(res);
        $("mealType").value = mealType;
        $("food").classList.add("highlight");
        $("food").focus();
        return;
      }
      if (!res.ok) {
        info.className = "error";
        info.textContent = await errorText(res);
        return;
      }

      const saved = await res.json();
      $("aiText").value = "";
      await loadFoods();                  // AI가 새로 만든 음식도 직접 선택 목록에 나타나게
      await loadDay({ animate: true });
      const list = saved.map((m) => `${m.food.name} ${fmt(m.grams)}g`).join(", ");
      info.className = "info";
      info.textContent = `${MEAL_NAMES[mealType]}으로 ${list}을 기록했어요. 양이 다르면 기록을 지우고 직접 추가해 주세요.`;
    } catch (err) {
      info.className = "error";
      info.textContent = err.message;
    } finally {
      button.disabled = false;
      button.textContent = "AI로 기록";
    }
  });

  // 추천을 그대로 기록 (폼이 다시 그려지므로 카드에서 이벤트를 받음)
  $("recommend").addEventListener("submit", async (e) => {
    if (e.target.id !== "recForm" || !currentRec) return;
    e.preventDefault();
    const rec = currentRec;
    const mealType = $("recMealType").value;
    const button = e.target.querySelector("button");
    button.disabled = true;
    $("recommendInfo").textContent = "";
    const res = await api("/meals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date: dateInput.value, mealType, foodId: rec.food.id, grams: rec.grams }),
    });
    if (!res.ok) {
      button.disabled = false;
      $("recommendInfo").className = "error";
      $("recommendInfo").textContent = await errorText(res);
      return;
    }
    await loadDay({ animate: true });
    $("recommendInfo").className = "info";
    $("recommendInfo").textContent =
        `${rec.food.name} ${fmt(rec.grams)}g을 ${MEAL_NAMES[mealType]}으로 기록했어요. 요약과 추천을 다시 계산했어요.`;
  });

  // 목표 저장
  $("targetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("targetError").textContent = "";
    const res = await api("/me/targets", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kcal: Number($("tKcal").value),
        carbohydrate: Number($("tCarb").value),
        protein: Number($("tProtein").value),
        fat: Number($("tFat").value),
      }),
    });
    if (!res.ok) {
      $("targetError").textContent = await errorText(res);
      return;
    }
    await loadMe();
    loadDay({ animate: true });   // 새 목표로 요약 막대와 추천 다시 계산
  });

  // 공공 데이터 검색
  $("publicForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("publicError").textContent = "";
    $("publicResults").innerHTML = `<tr><td colspan="4" class="empty">검색 중...</td></tr>`;
    const keyword = encodeURIComponent($("publicKeyword").value.trim());
    const res = await api(`/foods/public?keyword=${keyword}`);
    if (!res.ok) {
      $("publicResults").innerHTML = "";
      $("publicError").textContent = await errorText(res);
      return;
    }
    publicResults = await res.json();
    if (publicResults.length === 0) {
      $("publicResults").innerHTML = `<tr><td colspan="4" class="empty">검색 결과가 없어요</td></tr>`;
      return;
    }
    $("publicResults").innerHTML = publicResults.map((f, i) => `
      <tr>
        <td>${esc(f.name)}
          <span class="sub">${esc([f.maker, f.basis && `${f.basis} 기준`].filter(Boolean).join(" · "))}</span>
        </td>
        <td class="num">${f.kcal}</td>
        <td class="num">${f.carbohydrate} · ${f.protein} · ${f.fat}</td>
        <td class="num"><button class="import" onclick="importFood(${i}, this)">가져오기</button></td>
      </tr>`).join("");
  });

  async function importFood(index, button) {
    const f = publicResults[index];
    $("publicError").textContent = "";
    button.disabled = true;
    try {
      await createFood({
        name: f.name.slice(0, 50),
        kcalPer100g: f.kcal,
        carbohydrate: f.carbohydrate,
        protein: f.protein,
        fat: f.fat,
      });
      button.textContent = "등록됨";
    } catch (err) {
      $("publicError").textContent = err.message;
      button.disabled = false;
    }
  }

  // 음식 직접 등록
  $("foodForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("foodError").textContent = "";
    try {
      await createFood({
        name: $("foodName").value,
        kcalPer100g: Number($("foodKcal").value),
        carbohydrate: Number($("foodCarb").value),
        protein: Number($("foodProtein").value),
        fat: Number($("foodFat").value),
      });
      $("foodForm").reset();
    } catch (err) {
      $("foodError").textContent = err.message;
    }
  });

  dateInput.addEventListener("change", () => {
    $("recommendInfo").textContent = "";
    loadDay();
  });

  loadMe().then(loadFoods).then(loadDay);
</script>
</body>
</html>
