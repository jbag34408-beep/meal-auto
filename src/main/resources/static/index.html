<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식단 자동화</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1f2421; --muted: #6b716d;
    --line: #e4e0d8; --accent: #2f6f4f; --accent-soft: #e3efe8; --danger: #b4443a;
    --carb: #d9a441; --protein: #2f6f4f; --fat: #b06a3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.5px; }
  h2 { margin: 0 0 14px; font-size: 16px; color: var(--muted); font-weight: 600; }
  input, select, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; min-width: 0; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .ghost { background: none; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .kcal { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .kcal small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .bars { display: grid; gap: 10px; margin-top: 16px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; }
  .recommend { background: var(--accent-soft); border-color: transparent; }
  .recommend strong { font-size: 20px; }
  form { display: grid; gap: 8px; }
  .meal-form { grid-template-columns: 1fr 1fr 110px auto; }
  .food-form { grid-template-columns: 2fr repeat(4, 1fr) auto; }
  .target-form { grid-template-columns: repeat(4, 1fr) auto; }
  .public-form { grid-template-columns: 1fr auto; }
  label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sub { display: block; color: var(--muted); font-size: 12px; }
  .del { background: none; color: var(--danger); padding: 4px 8px; }
  .import { padding: 5px 10px; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  .error { color: var(--danger); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .info { color: var(--accent); font-size: 14px; margin-top: 8px; min-height: 18px; }
  @media (max-width: 560px) {
    .meal-form, .food-form, .target-form { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘의 식단</h1>
    <div class="user">
      <span id="username"></span>님
      <button class="ghost" id="logout">로그아웃</button>
      <input type="date" id="date">
    </div>
  </header>

  <section class="card">
    <h2>하루 요약</h2>
    <div class="kcal"><span id="kcal">0</span> <small>/ <span id="kcalTarget">2000</span> kcal · <span id="count">0</span>끼</small></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="card recommend">
    <h2>다음 끼니 추천</h2>
    <div id="recommend">-</div>
  </section>

  <section class="card">
    <h2>식사 기록 추가</h2>
    <form id="mealForm" class="meal-form">
      <select id="food" required></select>
      <select id="mealType">
        <option value="BREAKFAST">아침</option>
        <option value="LUNCH">점심</option>
        <option value="DINNER">저녁</option>
        <option value="SNACK">간식</option>
      </select>
      <input type="number" id="grams" placeholder="g" min="1" max="5000" required>
      <button type="submit">추가</button>
    </form>
    <div class="error" id="mealError"></div>
  </section>

  <section class="card">
    <h2>기록</h2>
    <table>
      <thead><tr><th>끼니</th><th>음식</th><th class="num">섭취량</th><th class="num">칼로리</th><th></th></tr></thead>
      <tbody id="meals"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>내 하루 목표</h2>
    <form id="targetForm" class="target-form">
      <label class="field">칼로리(kcal)<input type="number" id="tKcal" min="500" max="10000" step="1" required></label>
      <label class="field">탄수화물(g)<input type="number" id="tCarb" min="1" max="1000" step="0.1" required></label>
      <label class="field">단백질(g)<input type="number" id="tProtein" min="1" max="500" step="0.1" required></label>
      <label class="field">지방(g)<input type="number" id="tFat" min="1" max="500" step="0.1" required></label>
      <button type="submit" style="align-self:end">저장</button>
    </form>
    <div class="error" id="targetError"></div>
  </section>

  <section class="card">
    <h2>공공 데이터에서 음식 찾기 (식약처)</h2>
    <form id="publicForm" class="public-form">
      <input id="publicKeyword" placeholder="예: 사과, 김치찌개" required>
      <button type="submit">검색</button>
    </form>
    <div class="error" id="publicError"></div>
    <table>
      <thead><tr><th>음식</th><th class="num">kcal</th><th class="num">탄·단·지(g)</th><th></th></tr></thead>
      <tbody id="publicResults"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>음식 직접 등록 (100g 기준)</h2>
    <form id="foodForm" class="food-form">
      <input id="foodName" placeholder="이름" required>
      <input type="number" id="foodKcal" placeholder="kcal" min="0" max="900" step="0.1" required>
      <input type="number" id="foodCarb" placeholder="탄수화물 g" min="0" max="100" step="0.1" required>
      <input type="number" id="foodProtein" placeholder="단백질 g" min="0" max="100" step="0.1" required>
      <input type="number" id="foodFat" placeholder="지방 g" min="0" max="100" step="0.1" required>
      <button type="submit">등록</button>
    </form>
    <div class="error" id="foodError"></div>
  </section>
</main>

<script>
  const MEAL_NAMES = { BREAKFAST: "아침", LUNCH: "점심", DINNER: "저녁", SNACK: "간식" };
  const $ = (id) => document.getElementById(id);
  const dateInput = $("date");
  let me = null;             // 로그인한 회원 정보와 목표
  let publicResults = [];

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  dateInput.value = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);

  // 모든 API 호출은 이 함수로: 로그인이 풀렸으면(401) 로그인 화면으로 이동
  async function api(url, options) {
    const res = await fetch(url, options);
    if (res.status === 401) {
      location.href = "/login.html";
      throw new Error("로그인이 필요해요");
    }
    return res;
  }

  async function errorText(res) {
    try {
      const err = await res.json();
      const details = Object.values(err.errors || {}).join(", ");
      return details || err.message || `요청 실패 (${res.status})`;
    } catch {
      return `요청 실패 (${res.status})`;
    }
  }

  async function loadMe() {
    me = await (await api("/me")).json();
    $("username").textContent = me.username;
    $("kcalTarget").textContent = Math.round(me.targetKcal);
    $("tKcal").value = me.targetKcal;
    $("tCarb").value = me.targetCarbohydrate;
    $("tProtein").value = me.targetProtein;
    $("tFat").value = me.targetFat;
  }

  async function loadFoods() {
    const foods = await (await api("/foods")).json();
    $("food").innerHTML = foods
      .map((f) => `<option value="${f.id}">${esc(f.name)} (100g당 ${f.kcalPer100g}kcal)</option>`)
      .join("");
  }

  async function loadDay() {
    const date = dateInput.value;
    const [meals, summary, recText] = await Promise.all([
      api(`/meals?date=${date}`).then((r) => r.json()),
      api(`/summary?date=${date}`).then((r) => r.json()),
      api(`/recommendation?date=${date}`).then((r) => r.text()),
    ]);
    renderSummary(summary);
    renderRecommend(recText ? JSON.parse(recText) : null);
    renderMeals(meals);
  }

  function renderSummary(s) {
    const targets = [
      { key: "totalCarbohydrate", name: "탄수화물", target: me.targetCarbohydrate, color: "var(--carb)" },
      { key: "totalProtein", name: "단백질", target: me.targetProtein, color: "var(--protein)" },
      { key: "totalFat", name: "지방", target: me.targetFat, color: "var(--fat)" },
    ];
    $("kcal").textContent = Math.round(s.totalKcal);
    $("count").textContent = s.mealCount;
    $("bars").innerHTML = targets.map((t) => {
      const value = s[t.key];
      const percent = Math.min(100, (value / t.target) * 100);
      return `
        <div>
          <div class="bar-label"><span>${t.name}</span><span>${value}g / ${t.target}g</span></div>
          <div class="bar"><div style="width:${percent}%; background:${t.color}"></div></div>
        </div>`;
    }).join("");
  }

  function renderRecommend(rec) {
    $("recommend").innerHTML = rec
      ? `<strong>${esc(rec.food.name)} ${rec.grams}g</strong><div>${esc(rec.reason)}</div>`
      : "오늘 목표를 모두 채웠어요";
  }

  function renderMeals(meals) {
    if (meals.length === 0) {
      $("meals").innerHTML = `<tr><td colspan="5" class="empty">아직 기록이 없어요</td></tr>`;
      return;
    }
    $("meals").innerHTML = meals.map((m) => `
      <tr>
        <td>${MEAL_NAMES[m.mealType]}</td>
        <td>${esc(m.food.name)}</td>
        <td class="num">${m.grams}g</td>
        <td class="num">${Math.round(m.food.kcalPer100g * m.grams / 100)}kcal</td>
        <td class="num"><button class="del" onclick="deleteMeal(${m.id})">삭제</button></td>
      </tr>`).join("");
  }

  async function deleteMeal(id) {
    if (!confirm("이 기록을 삭제할까요?")) return;
    await api(`/meals/${id}`, { method: "DELETE" });
    loadDay();
  }

  async function createFood(food) {
    const res = await api("/foods", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(food),
    });
    if (!res.ok) throw new Error(await errorText(res));
    const saved = await res.json();
    await loadFoods();
    $("food").value = saved.id;
    return saved;
  }

  // 로그아웃
  $("logout").addEventListener("click", async () => {
    await fetch("/logout", { method: "POST" });
    location.href = "/login.html";
  });

  // 식사 기록 추가
  $("mealForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("mealError").textContent = "";
    const res = await api("/meals", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        date: dateInput.value,
        mealType: $("mealType").value,
        foodId: Number($("food").value),
        grams: Number($("grams").value),
      }),
    });
    if (!res.ok) {
      $("mealError").textContent = await errorText(res);
      return;
    }
    $("grams").value = "";
    loadDay();
  });

  // 목표 저장
  $("targetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("targetError").textContent = "";
    const res = await api("/me/targets", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kcal: Number($("tKcal").value),
        carbohydrate: Number($("tCarb").value),
        protein: Number($("tProtein").value),
        fat: Number($("tFat").value),
      }),
    });
    if (!res.ok) {
      $("targetError").textContent = await errorText(res);
      return;
    }
    await loadMe();
    loadDay();   // 새 목표로 요약 막대와 추천 다시 계산
  });

  // 공공 데이터 검색
  $("publicForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("publicError").textContent = "";
    $("publicResults").innerHTML = `<tr><td colspan="4" class="empty">검색 중...</td></tr>`;
    const keyword = encodeURIComponent($("publicKeyword").value.trim());
    const res = await api(`/foods/public?keyword=${keyword}`);
    if (!res.ok) {
      $("publicResults").innerHTML = "";
      $("publicError").textContent = await errorText(res);
      return;
    }
    publicResults = await res.json();
    if (publicResults.length === 0) {
      $("publicResults").innerHTML = `<tr><td colspan="4" class="empty">검색 결과가 없어요</td></tr>`;
      return;
    }
    $("publicResults").innerHTML = publicResults.map((f, i) => `
      <tr>
        <td>${esc(f.name)}
          <span class="sub">${esc([f.maker, f.basis && `${f.basis} 기준`].filter(Boolean).join(" · "))}</span>
        </td>
        <td class="num">${f.kcal}</td>
        <td class="num">${f.carbohydrate} · ${f.protein} · ${f.fat}</td>
        <td class="num"><button class="import" onclick="importFood(${i}, this)">가져오기</button></td>
      </tr>`).join("");
  });

  async function importFood(index, button) {
    const f = publicResults[index];
    $("publicError").textContent = "";
    button.disabled = true;
    try {
      await createFood({
        name: f.name.slice(0, 50),
        kcalPer100g: f.kcal,
        carbohydrate: f.carbohydrate,
        protein: f.protein,
        fat: f.fat,
      });
      button.textContent = "등록됨";
    } catch (err) {
      $("publicError").textContent = err.message;
      button.disabled = false;
    }
  }

  // 음식 직접 등록
  $("foodForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("foodError").textContent = "";
    try {
      await createFood({
        name: $("foodName").value,
        kcalPer100g: Number($("foodKcal").value),
        carbohydrate: Number($("foodCarb").value),
        protein: Number($("foodProtein").value),
        fat: Number($("foodFat").value),
      });
      $("foodForm").reset();
    } catch (err) {
      $("foodError").textContent = err.message;
    }
  });

  dateInput.addEventListener("change", loadDay);

  loadMe().then(loadFoods).then(loadDay);
</script>
</body>
</html>
