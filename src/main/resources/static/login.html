<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 식단 자동화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --band: #0f1311; --band-ink: #ecefe9; --band-muted: #a3aca6; --band-line: rgba(236, 239, 233, 0.14);
    --panel: #fff; --paper: #eef1ec; --text: #18201b; --muted: #5b655f; --line: #d5dbd4;
    --accent: #2f6f4f; --danger: #a63d33;
    --carb-ink: #e2b25a; --protein-ink: #7fbf9c; --fat-ink: #d98e5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--band); color: var(--band-ink);
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    word-break: keep-all; -webkit-font-smoothing: antialiased;
  }
  .shell { width: 100%; max-width: 400px; }

  /* 세 가닥: 랜딩·앱과 같은 표식 */
  .mark { display: grid; gap: 6px; width: 72px; margin-bottom: 22px; }
  .mark i { display: block; height: 6px; border-radius: 999px; }
  .mark i:nth-child(1) { width: 100%; background: var(--carb-ink); }
  .mark i:nth-child(2) { width: 70%; background: var(--protein-ink); }
  .mark i:nth-child(3) { width: 45%; background: var(--fat-ink); }

  h1 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
  .lede { margin: 10px 0 28px; color: var(--band-muted); font-size: 15px; line-height: 1.55; }
  .lede a { color: var(--band-ink); }

  .card { background: var(--panel); color: var(--text); border-radius: 18px; padding: 8px 24px 24px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; color: var(--muted); border: none; padding: 14px 10px 12px; font: inherit; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 700; }
  form { display: grid; gap: 10px; }
  input, button.submit { font: inherit; padding: 13px 14px; border-radius: 10px; min-width: 0; }
  input { border: 1px solid transparent; background: var(--paper); color: var(--text); }
  input:focus-visible { background: #fff; border-color: var(--line); }
  input:focus-visible, .tab:focus-visible, button.submit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.submit { margin-top: 4px; background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 700; }
  button.submit:hover { background: #275e43; }
  button.submit:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 10px; }
  .hint { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .hint b { color: var(--text); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1>식단 자동화</h1>
  <p class="lede">먹은 음식을 적으면 영양을 계산하고 다음 끼니를 추천해요. <a href="/landing.html">어떻게 동작하나요?</a></p>

  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab" id="loginTab" role="tab" aria-selected="true" aria-controls="loginForm">로그인</button>
      <button class="tab" id="signupTab" role="tab" aria-selected="false" aria-controls="signupForm">회원가입</button>
    </div>

    <form id="loginForm" role="tabpanel" aria-labelledby="loginTab">
      <input id="loginUsername" placeholder="아이디" autocomplete="username" required aria-label="아이디">
      <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required aria-label="비밀번호">
      <button class="submit" type="submit">로그인</button>
    </form>

    <form id="signupForm" role="tabpanel" aria-labelledby="signupTab" hidden>
      <input id="signupUsername" placeholder="아이디 (영문·숫자 4~20자)" autocomplete="username" required aria-label="아이디">
      <input id="signupPassword" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="new-password" required aria-label="비밀번호">
      <button class="submit" type="submit">가입하고 시작하기</button>
    </form>

    <div class="error" id="error" role="alert"></div>
    <p class="hint">체험용 계정: <b>demo</b> / <b>demo1234</b></p>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function showTab(isLogin) {
    $("loginTab").setAttribute("aria-selected", String(isLogin));
    $("signupTab").setAttribute("aria-selected", String(!isLogin));
    $("loginForm").hidden = !isLogin;
    $("signupForm").hidden = isLogin;
    $("error").textContent = "";
    (isLogin ? $("loginUsername") : $("signupUsername")).focus();
  }
  $("loginTab").onclick = () => showTab(true);
  $("signupTab").onclick = () => showTab(false);

  // Spring Security 로그인은 JSON이 아니라 폼 형식(username=...&password=...)으로 보냄
  async function login(username, password) {
    const res = await fetch("/login", {
      method: "POST",
      body: new URLSearchParams({ username, password }),
    });
    if (!res.ok) throw new Error("아이디 또는 비밀번호가 맞지 않아요. 다시 확인해 주세요.");
    location.href = "index.html";
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    const button = e.target.querySelector("button");
    button.disabled = true;
    try {
      await login($("loginUsername").value, $("loginPassword").value);
    } catch (err) {
      $("error").textContent = err.message;
      button.disabled = false;
    }
  });

  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    const button = e.target.querySelector("button");
    button.disabled = true;
    const username = $("signupUsername").value;
    const password = $("signupPassword").value;
    const res = await fetch("/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      $("error").textContent = Object.values(err.errors || {}).join(", ") || err.message || "가입하지 못했어요. 입력값을 확인해 주세요.";
      button.disabled = false;
      return;
    }
    try {
      await login(username, password);   // 가입 후 바로 로그인
    } catch (err) {
      $("error").textContent = err.message;
      button.disabled = false;
    }
  });
</script>
</body>
</html>
