spring.application.name=meal-auto
# 식약처 식품영양성분 API (키는 환경 변수로만)
food-api.base-url=https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo02/getFoodNtrCpntDbInq02
food-api.key=${FOOD_API_KEY:}

# Gemini 식사 분석 - 무료 등급 (키는 환경 변수로만, 결제 계정 연결 금지)
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
# 기본 모델이 붐비거나 한도 초과일 때 차례대로 시도할 무료 모델 (쉼표로 구분)
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash,gemini-3.5-flash-lite}

# SQL 로그
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# 6단계: 파일 DB (서버를 꺼도 데이터 유지)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mealdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
#서버
server.port=${PORT:8080}
