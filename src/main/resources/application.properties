spring.application.name=meal-auto
# 식약처 식품영양성분 API (키는 환경 변수로만)
food-api.base-url=https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo02/getFoodNtrCpntDbInq02
food-api.key=${FOOD_API_KEY:}

# Gemini 식사 분석 - 무료 등급 (키는 환경 변수로만, 결제 계정 연결 금지)
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
# 기본 모델이 붐비거나 한도 초과일 때 차례대로 시도할 무료 모델 (쉼표로 구분)
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash,gemini-3.5-flash-lite}

# SQL 로그: 기본은 끔 (운영 로그에 쿼리·값이 쌓이지 않게), 로컬에서 보고 싶으면 SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# DB: 로컬은 H2 파일 DB(./data), 배포는 외부 PostgreSQL(Render PostgreSQL·Neon)
# - DB_URL에 대시보드의 접속 주소(postgres://아이디:비밀번호@호스트/DB이름)를 그대로 넣으면
#   서버가 시작할 때 JDBC 형식과 아이디·비밀번호로 나눠서 씀 (config/DatabaseUrl)
# - Render 무료 인스턴스는 재시작 때 디스크가 초기화되므로 배포에서 H2 파일 DB는 쓰지 않음
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mealdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
#서버
server.port=${PORT:8080}
